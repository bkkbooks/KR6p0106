body:
  text: 淨土隨學題詞每嘆娑婆無量苦死生輪回沒定所才得人身轉瞬間又隨惡報沉冥府何幸世尊悲願深特駕慈航救沉淪無問自説持名法欲使含靈盡出塵東土闡揚自遠祖社結廬山修淨土高士無數悉往生後裔諸賢踵其武傷哉正法值陵夷學侶紛紛喜鬬奇但念彌陀心顯現不肯承當反覔誰敲門瓦子打親娘可憐背騁趣羊腸好説唯心無他土如斯邪見更可傷幸師力將悲智運法藥遍施救時病一字一句總清涼令速超凡義無剩神珠且寶不可量亦猶帝網映千光根器奚容分高下隨分領納盡非常神珠即師所集之書極應時機以開圓解淨業學者當細玩之嗟我何緣值明師一言痛快愈盲癡瑩向喜持名愧無要指蒙師示以嬰兒墮水急呼母救之喻頓息馳求深霑法乳但願法寶常住世人人隨學霑恩施時大清光緒元年歲次乙亥中秋日涔陽後學照瑩敬然臂香三炷稽首題於法源庵之報恩關前淨土隨學目録上卷阿彌陀經禮想儀阿彌陀經頌臨睡入觀禮誦儀九品觀章頌西方徑路偈發願受持勸持經念佛即心念佛頌念佛述懷念佛偶成無上深妙禪供奉佛名淨土總讚佛立華池讚慕西方樂厭娑婆苦取捨然指文結壇持名解七懺願偈題讀佛軒約誓自勉誡止人情七期禁語日課慎言普觀念佛專修要訣念佛開心頌極樂甚奇特淨宗八要痛策惡習稱名自慰下卷蓮宗必讀序西方徑路序自警録後序淨土神珠序西歸行儀序經律異相序觀經妙宗鈔序彌陀圓中鈔序淨土十要序往生集序圓覺經序圓覺彌陀二經合讚刺血寫阿彌陀經發願刺血寫四十八願九品觀章發願自慶聞法然身香發願然臂香供圓通偈發願然臂香供圓覺經發願牙痛然臂香懺悔發願病久發願戒述發願慎狂發願七期發願呵棄欲蓋血佛像詩為友封龕往生要關佛恩加被憶恩流淚慶領直捷惜前謬濫名號本願持名自得持名要䇿持名重口持名當響持名伏妄三業圓修有佛土頌自題小照痛䇿依稀深恩略讚佛前號哭刺血暢懷老實念佛念佛慰進三業同運繞佛偶成持名要切願師生蓮掩關警䇿䇿不相應讚佛聯對
