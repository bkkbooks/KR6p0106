body:
  text: 戀西學人玉峯古崑自編蓮宗必讀總序淨土法門者乃諸佛究竟之法也故彌陀因地觀此理而大誓普收釋迦果成稱此理而廣舌深讚彼則鉅賢至聖咸舒藻以為盟此則覺德鴻儒盡摛毫而作誓挺身立行力修此道者列宿塵沙莫況其多也下至惡逆凡夫十念便登寶土飛禽畜類隨稱亦達金池此非彌陀願力安能若是經云末法億億人修行罕一得道唯依念佛得度靈峯云於念佛法門中求其至簡易至直捷者莫若信願專持名號是故淨土三經並行古人獨以彌陀經為日課豈非持名一法普被三根攝事理無遺統宗教無外尤不可思議也哉其名號功德自何而始乃因六八大願之所莊嚴九品悲心之所成就也然彼佛願力雖不可思議若厭離不深則娑婆業繫不脫故藉五王八苦之緣以作進修之䇿而進修儀軌甚多唯慈雲行願最為切要上根之士一聞便信中下之輩多諸疑惑智者十疑論統淨宗一切疑問振菩提大道之綱斷疑生信厥功最巨善導云修餘行業迂僻難成唯此法門速超生死若專修者十即十生法照大師感文殊告曰汝今念佛正是其時當知念佛諸法之王慧日感觀音亦云汝當知淨土法門勝過諸行二大士皆法王長子親口傳授念佛法門殷勤如此可不信哉飛錫永明四明慈照優曇天如妙叶楚石幽溪等乃傳宗列祖闡教聖師皆撰文述偈深勸往生當細心玩味而詳擇之蕅益法師每見學者未識方隅靡慚濫吹或云念佛散心無益或云念佛須一心不亂或云念佛須參究是誰詰其信願毫無所知可悲也夫如意珠王遇此等人而成瓦礫以此故述信願持名歷九品說行者宜勤覧之又云得生與否全由信願之有無品位高下全由持名之深淺堅密云一句彌陀非大徹不能全提而最愚亦無少欠只貴一心受持甯羨依稀解悟省庵云暫持聖號勝於布施百年一發大心超過修行歷劫徹悟云淨土一門最初省求悟門末後不待發慧不須懺業不斷煩惱至極省要至極徑捷及其證入至極廣大至極究竟故要解云一聲阿彌陀佛即釋迦本師於五濁惡世所得之阿耨多羅三藐三菩提法今以此果覺全體授與濁惡眾生乃諸佛所行境界唯佛與佛能究盡非九界自力所能信解也如上所述咸遵佛祖誠言非敢臆說撮其詞明義顯最切要者會成一冊以便朝暮莊誦刻刻提撕如面聆法音不敢疑貳名之曰蓮宗必讀余為障緣深重濁智騰波非專修一行生死難脫匪憑聖教信願難階況去聖時遙邪風競起正行之人多被惑亂是故必讀此書然後必生淨土愧鄙見隘劣焉敢公諸勝友但自為鞭䇿而作往生左券敬摘諸文而謬為之序時在丁卯冬住普陀之法華洞西方徑路序夫一句彌陀稱徑路者乃橫絕迷源直投覺海至簡易至直捷之大方便也故經云若人但念阿彌陀是名無上深妙禪要解云當知執持名號既簡易直捷仍至頓至圓以念念即佛故不勞觀想不必參究當下圓明無餘無欠直指云無上正徧知覺普應機宜說法三百餘會皆令羣有同證真常求其機宜相感生佛緣深至簡至易而功高徑捷者無越求生淨土一門況五濁盛時眾生垢重餘道修行必難成就而匪仗此門其何從疾脫生死是故娑婆教主再四叮嚀十方如來殷勤勸讚千經萬論處處指歸往聖前賢人人趣向大矣哉一句彌陀真可謂渡苦海之巨航生西方之徑路也昔善導和尚專志於此眾稱彌陀化身豈欺我哉詳其自行化他總不出彌陀一經之妙旨乃云眾生障重境細心粗識颺神飛觀難成就是以大聖悲憐直勸專稱名號正由稱名易故相續即生若能念念相續畢命為期十即十生百即百生徹悟云倘置佛名而別修三乘聖行亦是浪用精神亦是千鈞之弩為鼷鼠而發機況造六凡生死之業乎又云世間出世思惟徧不念彌陀更念誰謹遵此旨并深信佛願將一句彌陀述成四十八偈盡採金口誠言及祖師臨終遺囑平生實行並非臆說名之曰西方徑路復集諸文為證以便初機易生正信倘有同志不以人廢言亦可憑此互相警策速念彌陀速生淨土速念眾生速行化度庶不負彌陀化身直指徑路一片血滴滴之老婆心矣發願回向云稽首娑婆說法主稱讚淨土十方佛極樂世界大導師淨土圓頓修多羅觀音勢至大海眾闡揚蓮社諸聖祖我發誠心集此書唯願證明垂加護復然臂香六八炷供養彌陀慈悲父願我承此殊勝因早促陽壽生淨土願此徑路廣流通見者聞者生欣慕早念彌陀早往生早入娑婆早化度淨土自警錄後序余於咸豐辛亥冬在仙居之南峯山閱蓮池大師彌陀疏鈔見序中云著事而念能相繼不虗入品之功執理而心實未明反受落空之禍誠哉此語感德無涯乃余信淨土之根本也因師兄敬峯上人指示圓覺妙經乃八道之要典便熟讀熟背忽疑經中之語發心參究雖障深未悟而信力已增一時不能放下是故仍住叢林多親禪德亦有慈悲知識方便證明自慚功淺不敢承當唯恐心實未明反受落空之禍不如繼念彌陀猶有入品之功況且名利習氣日有所增諒必工夫不相應故雖知如是還不能死心念佛何哉皆因不知念佛法門有奇特超勝之功只謂禪淨無二不生輕易而已後參昌啟老人於杭之大崇福屢𫎇痛拶盡改前非深知向上宗乘不是容易可得遂乃兼修淨業兼讀淨土諸書及見永明禪師四料簡云有禪無淨土十人九錯路無禪有淨土萬修萬人去祖師之言禪淨分別優劣乃爾可信淨土別有奇特索性棄禪修淨不讀他經後避兵災於普陀佛頂山之慧濟寺讀堅密大師淨要總序靈峯大師彌陀要解及幽溪大師圓中鈔等書乃知五濁盛時眾生障重非執持名號必難往生況此法門微妙難思一切諸佛之所護念從此晨朝十念記數持名遂然兩指供養兩土教主以作欣厭之本盡此一生誓無改變自後倣其樣者漸多虗名漸大每有學者再三請示余深漸障重勉學此門以此為人豈不謬哉用力推之莫不招怨不得已將金口之誠言祖師之要語述成一冊以此自警并警有緣之士勿執偏空勿貪禪語老實持名求生淨土書成之後復呈鄙見為之序淨土神珠序淨土神珠者何現前一念心性靈妙莫測之謂也彌陀經稱讚不可思議功德一切諸佛所護念者蓋為此也古今賢聖極力弘通寶王三昧亦為此也此心性者本自竪窮橫徧不生不滅本具十方諸佛淨妙國土是故實有西方彌陀淨土宛然在中無奈眾生障重不能得見故勞娑婆教主開方便門十方世尊出廣長舌故妙宗云心藏具法有何邊涯無妙觀緣隱而不發今依佛語順性想之寶地光明種種奇相隨心出現宗論云現前一念之心亘古亘今故名無量壽靈明洞徹故名無量光果能念念執持阿彌陀佛即是念念證無量壽放無量光果因交徹微妙難思諸佛護念其在茲焉故知淨土乃無上心要如如意珠頓含眾寶復何疑哉余惜從前雖喜淨土不知其實每問禪友皆云唯心淨土自性彌陀不可著相因此雖喜念佛但只著空而已後閱台淨二宗及無生論始知淨土實境昭彰即是唯心彌陀真身顯現即是自性實有淨土可生實有彌陀可見故云生本無生生四土見猶離見見三身從茲死心念佛求生謹將鄙見起信要言略集成編以此自勉并告同心所願廣開解目深入行門一句彌陀包含無盡佛功德海當念圓成釋迦勸讚諸佛同宣凡有信者不可不盡心而力行之也同治己巳夏月幽溪傳法後裔古崑稽首謹識西歸行儀序西歸行儀本戀西學人自行之佛事因閱妙宗圓中二鈔及淨土十要等書始知彌陀經十念門二經行儀四十八願九品觀章皆淨土必要深信切願莫不由斯是故將此奉為日課并告同心共作往生左券彌陀經者乃諸佛之心要樂那之家書功德不可思議故聞是經受持者皆為一切諸佛之所護念臨命終時彌陀聖眾現前導引況多佛勸持那堪不誦十念法門本彌陀大願實淨土指南修淨業者必不可少楚石禪師道高德備朝朝十念尚無虧焉禮想入觀二儀從時公行儀中摘出專修之士尤為急要修此者不觀境而淨境宛然不參心而真心全露可謂見佛之奇勳明心之妙訣也四十八願九品觀章乃法藏之因心彌陀之果德讀此方了彌陀因果始終不捨於我第苦惱眾生而依此持名於念念中必能圓具信願行之三種資粮西歸不遠唯在此矣如上皆諸祖闡揚之旨並非臆說唯願諸見聞皆生決定信勉力共修持同歸彌陀願一生成佛廣度眾生在此一舉不可緩也戀西學人古崑在舜江天台教觀敬然臂香四十八炷供養阿彌陀佛稽首謹序經律異相摘錄序昔釋迦如來慈愍應世說法四十九年積經千萬億卷總而名之曰經曰律曰論然於經律論三藏之中撮其要義則不出十法界之因果又於十界因果中究之則是現前一心更無別法迷之則九界雜陳生死不絕悟之則佛道圓成寂常真淨吾人欲知未來苦樂之果當觀現在善惡之因喻形端則影直源濁則流昏貪心重必沉鬼趣惡見猛必墮地獄向善多必生天官念佛切必往淨土唯須自己檢點不必旁問他人修行之士切宜慎之徹悟禪師云真法無性染淨從緣一真既舉體成十界則十界全體即一真是故善談心性者必不棄離於因果而深信因果者終必大明乎心性此理勢所必然也經律異相者乃梁之高僧所撰因其大藏浩瀚初心難入恐後向佛之徒因果不明修行無益是故備採經律專明因果會成一冊共五十卷欲令眾生憑此修學同證菩提余因亂世避居南海偶讀此書羣疑冰釋始知佛法之妙莫要於因果分明一心念佛惜其部帙猶廣披閱仍難由是發心摘錄兩卷欲刻流通普結法緣助生淨土云爾重刻觀經義疏妙宗鈔勸讀序觀無量壽佛經者乃釋迦本師為五濁惡世苦惱眾生而說之也特假韋提夫人受苦之緣以為發起令末世眾生早知厭苦早慕西方此經不獨被韋提希等圓頓之機悟無生忍亦能普收十惡五逆愚癡之輩入寶蓮華可謂勝異方便無上法門也昔天台智者大師眾稱小釋迦靈嶽親承大蘇妙悟證法華三昧獲無礙辯才以此判釋一代時教乃有三大五小之說論其部類則有三大五小之分究其要義則不出現前一念三千即空即假即中之妙三觀也觀經義疏者乃五小部之一也此經妙觀深固幽遠與華嚴法華同體非東土小釋迦誰堪解釋以合妙宗若不解釋安能令末世障重眾生了知三身不異四土圓融之微妙觀法也哉妙宗鈔者四明法智尊者所作尊者乃天台大師之遠孫也力闡台宗精修妙觀至宏淨土法門尤為要切見觀經義疏妙旨甚深初心難入若不重為細釋恐此圓頓妙觀不能廣傳於世故鈔云當知今觀非直於陰觀本性佛乃託他佛顯乎本性故應佛顯知本性明託外義成唯心觀立又云應知實相全體照明稱為真心亦名本覺覺體徧故諸法皆實若指其要不離現前分別之念念即本覺覺即經體無別經體以為所詮以此覺心觀於依正能所即絕對待斯忘妙觀之宗自茲而立寄語行者觀雖深妙本被初心若能進功何憂不就縱未入品為因亦強生至彼得預大會所見依正微妙難思速入聖階度生亦廣如此土人宿圓修者於諸座席見相殊常聞法易悟以此類彼功在妙宗願共有情即心念佛乃此鈔所以作也嗟乎吾奉此書已竭力矣至逢刀兵大亂四處奔逃亦負之而行唯恨神識飛颺不能作觀然所得利益不可思議焚身供養亦報不盡鈔云應知法界圓融不思議體作我一念之心亦復舉體作生作佛作依作正余閱至於此乃深思之既舉此體作生作佛作依作正則生佛依正一一無非法界圓融不思議體故知彌陀名號亦是舉此體而作亦即是法界圓融不思議體故幽溪大師云念佛之時此心便是圓融清淨寶覺以此妙心念彼阿彌則彼三身何身不念求彼四土何土不生靈峯大師深得此旨故於要解中云光則橫徧十方壽則竪窮三際橫竪交徹即法界體是故彌陀名號即是眾生本覺理性彌陀名號既即法界圓融不思議體則但持名號豈有一法而不圓收故幽溪靈峯堅密徹悟諸大祖師皆云持名不必更涉觀想參究等行余死心持名乃從此入今特記之以明法惠并告同行之士雖不作觀此書不可不讀若不讀此書安知淨土法門至頓至圓後來恐被他岐所惑甯不寒心願共勉之願共勉之深愧薄福不能將此法門重刊流布令法界眾生而共聞之幸有妙根然二師深知佛恩悲智雙運一見此書喜如獲寶再三閱之欣樂愈深遂募資刊布廣結大緣所願見者聞者深開妙解稱者觀者同見彌陀淨業之士欲深明三觀之旨鈔中已具余愧無文莫能嘆述聊採數言以為勸發云爾四明遠裔古崑然臂香九炷稽首謹識彌陀圓中鈔勸讀序夫彌陀一經乃釋迦如來於深法中作淺說廣法中作略說者也詮理則至頓至圓詮行則至簡至易故聞之者決定不退菩提修之者決定早登補處無奈眾生障垢日深經旨莫識由此而諸解漸興然解雖多論俯須時機則皆可稱美論闡揚妙觀則莫若幽溪大師之圓中鈔矣其序云以極樂依正為妙有一心持名為真空微真空而莫能證於極樂之妙有微妙有而莫能顯於此心之真空所謂不思議假非偏假真空不空非但空合是二者而行之則圓中圓滿非但中之道成是故命為鈔焉意欲讀是經而修行者顧名思義誠宜一心不亂而萬慮皆忘則真空之理彰七日持名念念相續則妙有之理顯行成而見佛心淨而華開娑婆之印壞而極樂之文成印壞所以空其情是之為真空文成所以立其法是之為妙有二者俱存而俱忘彌陀久經厥語所以略厥義所以深也崑於咸豐五年在杭之大崇福寺一見此書宛如熟識遂覓此板乃在城內法藏院諾庵法師所即印數十部以廣其傳因此淨緣漸熟圓解漸開是故歷逃兵難未嘗暫離願同學諸友此書必須多讀始得深生信願決志持名佛法之妙舉不外乎此矣淨土十要重梓序淨土十要者乃靈峯大師徹底悲心之所結集也堅密大師剖心瀝血之所流通也自古宏淨土者未有如此直剖心宗力救時病可謂將法王最勝寶藏一旦盡開普施大地眾生現成受用猶有不肯死心承當者真是愚之甚癡之極矣靈峯云深信發願的為淨土指南由此而執持名號乃為正行若信願堅固臨終十念一念亦決得生若無信願縱將名號持至風吹不入雨打不濕如銀牆鐵壁相似亦無得生之理修淨業者不可不知堅密云六字洪名念念之間欣厭具足如出幽獄奔託王家步步之間欣厭具足是故萬緣之唾不食眾苦之忍莫回又云一句彌陀非大徹不能全提而最愚亦無少欠倘有些子分別便成大法魔殃此乃二大師哀憐末世之大慈大悲真語實語大舌輪之所同說金色臂之所常垂皆此意也願深思之願深思之愧哉吾本屠門之子地獄之人賴佛光垂照善友提携乃知厭苦發心出家屢蒙師友重重開示始慕宗乘愧宿障深厚參究數年只解偏空而已辛酉春在虞東明因寺忽遭兵灾方覺前來學未真實幸佛恩加被在大難中雖傷一足猶可奔逃遂隱居於普陀佛頂山慧濟寺於夏月間細閱此書感激之至如多年暗室忽遇明燈可惜從前不肯細讀空過光陰悔之不及自此盡棄舊習專學持名欲具欣厭故然兩指十念記數皆從此起有淨侶妙能大師與余頗似宿緣一見歡喜乃共行之見十要序云像季久轉唯淨土一門契理契機而淨土諸書唯此諸要盡美盡善因兵燹之後此板無存遂發誠心勸募重梓唯願十方三世共遵此書同念彌陀同生淨土方慰諸佛廣長二師願力也矣學人古崑敬然臂香四十八炷供養阿彌陀佛稽首謹序重刻往生集序余尊奉此集略有三意一信本師親口告舍利弗曰汝等皆當信受我語及諸佛所說若有信者應當發願生彼國土己今當願己今當生集中上至高僧鴻儒下至愚夫愚婦信願念佛悉皆往生豈非本師金言的確非謬二信六方諸佛出廣長舌說誠實言汝等眾生當信是稱讚不可思議功德一切諸佛所護念經集中四眾人等乃至惡人臨終念佛皆得往生其惡人臨終應墮地獄暫稱佛號即免地獄而便往生如此功德安可思議也哉豈非諸佛稱讚不可思議功德真實不虗三信彌陀因中大誓願云十方眾生發菩提心修諸功德至心發願欲生我國臨壽終時假令不與大眾圍繞現其人前者不取正覺集中多見念佛之人臨命終時佛及聖眾親垂接引豈非彌陀誓願決定可憑蓮宗行者苟能具此三信決定往生無疑往生集者乃蓮池祖師大慈悲心之所撰也余確信淨土著事之功實因於此是故發心重募流通以公十方淨友普勸得此書者當時常披閱一則企慕先賢免生退屈一則增長信力淨業易成庶不負蓮祖之厚望焉讀圓覺經深信念佛序大方廣圓覺經者乃如來入大光明藏於不二境現諸淨土而說三世如來之所守護十方菩薩之所皈依十二部經清淨眼目豈不甚深微妙廣大圓融也哉圓覺者何現前一念無明業識之心是也經云無上法王有大陀羅尼門名為圓覺流出一切清淨真如菩提涅槃悟此故也又云一切眾生種種幻化皆生如來圓覺妙心迷此故也故裴公云離圓覺無六道捨圓覺無三乘非圓覺無如來泯圓覺無真法三世諸佛之所證蓋證此也如來為一大事出現蓋為此也三藏十二部一切修多羅蓋詮此也是經名為頓教大乘頓機眾生從此開悟亦攝漸修一切羣品譬如大海不讓小流乃至蚊䖟及阿修羅飲其水者皆得充滿是故古崑雖生末世惡業深重猶可得聞如斯妙經獲益甚深佛恩難報倘不知現前一念無明業識即是如來圓覺妙心那能決志專念彌陀若不專念彌陀定隨無明造生死業輪迴六道永無出期經中得益之處頗多不能全舉唯將念佛起信之言略引之耳經云一切眾生若佛住世若佛滅後若法末時有諸眾生具大乘性信佛秘密大圓覺心欲修行者當立期限稽首十方諸佛名字又云若諸眾生修三摩鉢提先當憶想十方如來夫圓覺經者本直指人心見性成佛最要之典尚云欲修行者先當憶想十方如來及諸佛名字故堅密大師云參禪必不可無淨土為防退墮甯不寒心此言禪淨兼修為益最大永明所謂有禪有淨土猶如帶角虎現世為人師當來作佛祖又何故偏云淨土必不可入禪機意見稍乘二門俱破蓋言事有顯理之功不必外加夾雜永明所謂無禪有淨土萬修萬人去但得見彌陀何愁不開悟可知圓覺妙經乃禪淨圓融賢愚普攝之大法門也永明之角虎亦不外乎此矣經云假使有人純以七寶積滿三千大千世界以用布施不如有人聞此經名及一句義假使有人教百恒河沙眾生得阿羅漢果不如有人宣說此經分則半偈圭峯云實由法無不持機無不被者也戀西學人古崑敬然臂香十二炷供養圓覺妙經唯願承此功德早見彌陀世尊誓度法界眾生同歸大圓覺海圓覺彌陀二經合讚大矣哉圓覺妙經真渡我出迷流之寶筏也若不讀此經安知現前一念竪窮橫徧無法不具若不知現前一念竪窮橫徧無法不具安信有十萬億佛土外之極樂世界阿彌陀佛若不信有極樂世界阿彌陀佛安肯死心持名發願往生若不肯死心持名發願往生安能速離苦海早見彌陀若不早見彌陀安得一時頓現自心本具無量功德也哉刺血寫阿彌陀經發願娑婆教主在祇園會上說出一卷阿彌陀經六方恒沙諸佛同聲稱讚同為護念復出廣長之舌徧覆大千世界普勸眾生應當信受何哉蓋此經乃直顯眾生久迷之自性大暢諸佛普度之本懷故也故經云將來經法滅盡特留此經百年眾生遇斯皆可得度若有眾生聞斯經者於無上道終不退轉是故應當專心信受持誦說行古崑為此述禮想儀奉為日課再欲將斯經典廣為人說以報佛恩舌鈍心昏不能滿願豈不恨極障深福薄乃至如此想在俗不遇此經決不能發意出家出家不仗此經決不能死心念佛此恩此德難報難酬是故每想刺血書寫此經以自供奉愧無忍力不敢下手直至同治癸酉忽得舌病經久不除定是累生妄語之報若不懺悔必墮三途因此發決定心對釋迦像前敬刺舌血書寫阿彌陀經又然臂香九炷供養娑婆教主本師釋迦牟尼佛極樂世界阿彌陀佛六方世界恒河沙數諸佛發願云弟子古崑見經中說已發願若已生今發願若今生當發願若當生是故我今至心發願我得舌病難除滅定是累生多妄說發心書寫彌陀經為表至誠刺舌血以此勅血之善因懺除舌根諸惡業願我臨欲命終時下品蓮華定得入唯願蓮華速速開早得如來廣長舌誓入娑婆惡世中將此妙經細解說隨聲出現妙莊嚴普令見聞生歡悅人人皆念阿彌陀箇箇同生極樂國仰願彼佛及本師并此經中六方佛大慈大悲同證明我願如是無休歇直顯者圓中鈔云瓊林玉沼直顯於心源壽量光明全彰於自性但舉假名全收實法故曰一稱嘉號萬德齊彰是則依此經修但以稱佛名號六字音聲而為所緣之境無以觀佛相好以濫經宗要解云阿彌陀佛是萬德洪名以名召德罄無不盡故即以執持名號為正行不必更涉觀想參究等行至簡易至直捷也故徹悟云一句所念之佛全德立名德外無名以名召德名外無德本徧一切本含一切絕待圓融不可思議蓮宗行者當從者裏信入又云深信切願專懇持名能於念念中齊澄眾染圓顯本空頓契靈源直趣果海徑路序所謂一句彌陀乃橫絕迷源直投覺海至簡易至直捷之大方便也如上引證皆直顯之旨願持名者同盡心焉光緒元年歲次乙亥佛涅槃日於法源庵之報恩關發此願也刺血寫四十八願九品觀章發願同治元年古崑在佛頂山慧濟寺閱淨土十要至寶王論中知智者大師臨終令讀四十八願九品觀章想智者乃東土釋迦臨終令讀豈非至要之言因此熟讀奉為日課為感得聞彌陀願力九界普收惡逆之人能稱十念亦必往生是故刺血書寫以常供奉發願云我今刺身血敬寫六八願願我命終時得見彌陀面又復然臂香炷數四十八供養阿彌陀願速生彼剎我今刺身血敬寫九品經願我早離苦早得下品生又然香九炷供養華池佛願求命終時蓮現如初日自慶聞法然身香發願我弟子古崑從於無始以至今生常因三毒造罪無邊今雖出家得聞佛法三毒之心依然常熾倘不聞彌陀有十念之願力蓮池有九品之方便那敢現世求願往生若不想現世往生必定退失善根轉貪利養非佛護念安有今朝是故於解七之際敬然身香五炷供養娑婆世界本師釋迦牟尼佛為感入五濁惡世說難信之法令我得聞彌陀名號死心執持又然身香十八炷供養六方世界一切諸佛為感護念阿彌陀經及聞是經受持者要解云聞經受持即執持名號又然身香四十八炷供養西方極樂世界光壽無量阿彌陀佛為感因中所發四十八願以名號功德普度有情至稱十念亦得往生又然身香九炷供養西方極樂世界在池水上阿彌陀佛為感果上所開九品方便令惡逆眾生十念稱佛得生寶池我弟子古崑以此然香功德至心回向唯願六方諸佛兩土世尊慈悲證明哀憐攝受願我盡此報身決定得生極樂世界七寶池中下品華內承佛冥加一彈指頃華開見佛即聞佛乘頓開佛慧廣度眾生滿菩提願然臂香供楞嚴觀音圓通偈發願我然臂香十二炷供養楞嚴圓通偈願我早生七寶池早淨耳根聞妙諦楞嚴經觀音圓通偈云十方俱擊皷十處一齊聞此則圓真實隔垣聽音響遐邇俱可聞此則通真實聲無亦無滅聲有亦非生生滅二圓離此則常真實幽溪大師楞嚴玄義云常真實即聞性竪窮不生不滅也圓真實即聞性橫徧無去無來也通真實即聞性清淨不受妄染也崑曰宛同圓覺經覺性徧滿清淨不動之義又云圓通常即三德也即常住真心也此數偈不唯可以驗耳根本理圓妙行者亦宜持此以資圓修如人靜居之時隨其音聲發於何方應於障外或動或靜而吾之聞性圓通常住於此彌可資而得矣又復應知法本非空非假亦非非空假秪由法性絕待就此寓名為中秪由法性無染就此寓名為空秪由法性具足諸法就此寓名為假只一法性即絕待即無妄即具法如摩尼寶珠即瑩徹即具寶即體圓雖三宛然而是一珠雖是一珠而三宛然耳根圓通亦復如是十方俱擊皷十處一齊聞就此絕待說名為中能觀此圓是觀中道隔垣聽音響遐邇俱可聞就此無礙說名為空能觀此通是觀真空聲無亦無滅聲有亦非生就此無生說名為有能觀此常是觀妙有天台云全由性具實匪修成不其然乎此猶約不次中說於次弟若不次不次說者舉圓必通必常舉通必圓必常舉常必圓必通是故返聞之時但觀其圓則通之於常皆在是矣文崑為沙彌時初閱此經一見擊鐘驗常及此偈等便生歡喜遂將此經常帶身邊故受戒後住國清禪堂於靜夜中歡喜聽幽冥鐘反觀聞性一夜聞鐘聲恍有所解而成偈云本來無可比因他現其己他己自消融無憂亦無喜後見幽溪生無生論云靈虗不昧吾心自空也物來斯應吾心自有也空有相即吾心自中也此性也非修也三諦也非三觀也修之者稱性照了也體達此心空洞無物謂之空照了此性具足萬法謂之假融通二邊不一不異謂之中然則即虗靈而應物也即應物而虗靈也空即假中也假即空中也中即空假也是稱性而修也絕待而照也不思議之三觀也首楞大定之司南也始知前所解者恍契此旨乃信極樂依正莊嚴之他物即吾人虗靈不昧之自心故圓中鈔云離彼妙有無以顯此真空離此真空無以證彼妙有余幸知此方能勇信西方死心求生實從無生論及圓中鈔而入是故願嗣台宗為幽溪之後裔焉然臂香供圓覺經發願我然臂香十二炷供養圓覺了義經願我早見阿彌陀早來以此度羣生圓覺經云彼知覺者猶如虗空知虗空者即空華相亦不可說無知覺性有無俱遣是則名為淨覺隨順崑因師兄指示讀至於此喜而有疑遂向日用中參箇能知覺者畢竟是誰亦在國清寺禪堂於解七之際豁然有省如久渴得漿喜不可說後念佛時因述偈云本有一圓覺動轉及施為明明全體是何必更問誰了了無踪跡時時在目前本來離言說故佛亦無傳吾聞淨土教頗似有宿因所食諸雜毒吐成六字經崑因宿障深重學禪難就遂捨之修淨恐招謗禪之罪是故將從前濫沾法乳之言至心呈出一表賢聖流通經典之恩一表祖師建立禪堂之德雖則入門甚淺然於淨土甘心守愚全仗此矣牙痛發願古崑恒受牙痛心不能忍靜心思之定是前生毀謗三寶及一切人故招此報若不懺悔必墮地獄是故發心敬然臂香四十八炷供養阿彌陀佛發露懺悔願早往生願云我受牙痛為何因諒必前生謗三尊謗法謗僧過已重再加謗佛罪難陳若不懺悔并發願必墮地獄痛尤深故然臂香六八炷供養彌陀大慈尊願我速離牙痛苦願我促壽早往生願我早見彌陀面以真實語利羣生讚佛讚僧心不已更讚淨土妙法門普令眾生皆度脫我願方始得稱心仰願十方三世佛一切菩薩賢聖僧大慈大悲同證明同垂救護令往生病久發願古崑於癸酉年三月初五日身染重病直至秋間夜不安眠口不開味生死之事未知如何想我此生別無所能只有淨土一門極力相信誠恐宿業深重現生不能如願豈不孤負佛恩枉被法服虗消一切信心供養佛袈裟下失却人身最堪痛惜異方便中不成道業𡩋不悲傷故於九月二十三日在天台教觀啟建四十九日七期禁止語言不敢放逸每日早晨敬然臂香三炷供養阿彌陀佛發願云六八大願王九品妙慈力令我速歸去早來度一切我壽若未盡願令病消滅誓發精進心持名不休歇戒述發願古崑慚愧數年以來謬述偈文自不知醜靜心思之不但枉費工夫全無利益而且勞損精神增長狂見其害非淺止觀云領持記憶心勞志倦言論往復水濁珠昏領持記憶乃學佛法之要事修止觀者尚須棄捨況專持名號現世求生之人那可向外習學擾亂心神使三昧不成往生難決為改前非復成偈云謬述偈文向外學妄招賢士生輕薄祖師妙典積如山何用吾盲多造作可醜可醜真可醜私採他言為己有如此狂心不肯休西方直路成橫走如斯深障每欲戒之意馬難止是故於同治癸酉年佛成道日敬然臂香三炷立誓願云古崑此生再述偈文必墮地獄又敬然臂香六炷供養釋迦如來彌陀世尊唯願以慈悲願力加被於我令我定心念佛速往西方早見慈尊頓開佛慧盡未來際說法利生慎狂發願妙叶禪師云交情不求益我情益我則虧失道義虧道義必見人之非又云與人不求順適人順適則內必自矜內自矜必執我之是崑每好亂改學友之言豈非見人之非執我之是故知虧道內矜受害非淺淨業未成自救不了那敢評人是非的是狂魔所附回心思之懊悔不已是故於光緒元年夏日向阿彌陀佛敬然臂香九炷以求懺悔發願偈云深慚無智起狂見每每胡圖改友言今向佛前求懺悔願除狂害早生蓮七期發願要解云得生與否全由信願之有無品位高下全由持名之深淺徹悟云真能發願則信在其中信願既具則行不期起而自起是故信願行三種資糧唯一願字盡之矣崑每揣障重要仗一心不亂方得往生今生決定不能若仗信願能生似可勉力是故凡建七期定十萬彌陀為日課以作發願之本決不求一心不亂每晨必然臂香三炷供佛至心發願云我今然臂香供養彌陀佛願我命終時決定生彼國呵棄欲蓋慈雲懺願儀云定取淨業即時成就不得一念思憶五塵呵去愛欲勤息恚癡行人各有無始惡習速求捨離不為正懺障礙當觀察何習偏重呵棄調停取令平復勿便行法唐喪其功余為此採止觀方便中呵五欲棄五蓋之文附以欣求淨土之意述成十偈寫諸坐隅日以自警云色色欲侵人禍甚深輪迴六道苦彌增願求彼佛垂慈愍早放光明接往生聲媚言艶曲眾邪聲惱亂行人道不成誓念佛名生彼國常聽靈鳥唱玄音香芬芳馥郁害非輕高志之人亦被侵唯願早登安養國蓮華香裏悟無生味沙彌躭味墮蟲身此欲由來害亦深及早修行生極樂酥酡妙食自然成觸堪嗟觸害少人知垢體常希細軟衣託質蓮華身淨潔微風吹著妙難思貪貪心一起黑沉沉人相翻為餓鬼形急念彌陀生寶所現成受用不須尋嗔炎炎嗔火若蛇形燒却無邊功德林遙羨樂諸善友慈悲喜捨利羣生睡睡魔久住黑山林晝夜常欺學道人痛策身心稱彼佛早歸極樂始安𡩋掉悔掉舉身心障已深更縈憂悔道難成一聲佛號超生死自在逍遙莫比倫疑疑蓋縈纏道不成應須急棄莫存心樂有路原相近信極方能易往生血佛像詩同治壬申夏初崑在旌教講寺看顯明和尚之病見妙能法師自題血像詩十首喜其深得欣厭取捨之旨故不揣庸愚學而和之每得二首原韻別記久背彌陀大導師深沉苦海莫能離剖身欲畫慈悲像滴血解鮮帶淚垂血描極樂大恩師盡報歸依不敢離苦海漂流無可出願伸寶手近吾垂說著死門涕淚淋深慚虗度莫追尋至心血寫如來像願我速聞極樂音窮兒嘆苦淚淋淋痛失摩尼沒處尋割血圖成親長者朝朝求降大慈音勞勞碌碌百無成孤負靈臺一點明賴有彌陀垂攝受恭描血像願求生善事難周惡易成皆由因果不分明今刳舌血描慈像九品華池定得生造業之時只一軀三途受苦有千殊願從此世生安養剖血描成彼佛模只說聖凡各一軀誰知真性體無殊誠心血繪彌陀像帶起當人臺日模覺體靈明本自安量周沙界一毫端血圖聖像皆因此唯願諸人著眼看莊嚴淨土最堪安寶樹重重樂萬端痛血畫成調御像願生彼國倚欄看輪迴生死去還來何日能昇七寶臺割血描師求出苦免教痛哭響如雷剖身滴血畫如來願我臨終上寶臺諸佛現前同授手梵音慰喻響如雷現前一念本惺惺為染塵緣失己靈血畫彌陀全體露宛然心佛不丹青彌陀願海寂惺惺攝取羣生復本靈剖血繪成真實像是心是佛是丹青佛性常存非舊新眾生迷背認殘身精誠血畫慈尊像普願含靈越垢塵一點靈光萬古新情根覆蔽變凡身血心畫作西方佛願了娑婆歷劫塵情枷愛鎖莫能開急急回頭把藕栽恭對西方剖舌血描成彼佛宛然來彼佛願門正大開應將信種急培栽我今血畫金池像宛在心中無去來曠劫奔馳喪本真深悲空過負慈親今番立誓持名號滴血申誠畫佛身血寫彌陀即一真為人自肯乃方親還須把本逃生死念念休忘彼佛身為友封龕拈封條云真如界內本無東西之隔生滅門中却有來去之形恭惟旌教堂上顯明和尚一生行滿大事圓成可謂無所從來來生東土亦無所去去往西方更白數言聊表尊德脫俗離塵數十春尋師訪道志宏深因緣時至心華發親見無生舊主人苦志參禪功已至忘身為眾愈加精朝行百事無疲倦夜坐觀心達五更戒行精嚴如雪淨慈悲忍辱利羣生出言不說他人過居世常存厭世心臨終一著無餘事但念彌陀願往生可幸顯公歸西去堪憐吾輩少知音且道封龕一句作麼生多年苦行忙如箭今日安閒坐寶蓮便封往生要關念佛之人將往生時最怕心懷疑惑自生退屈謂我等生死凡夫罪障深重豈能一世便得往生此皆不如彌陀願力特為救度苦惱眾生一生成就而設此方便也觀經云十惡五逆臨終苦逼教稱十念即生彼國此豈非一生成就之明證乎十惡五逆乃極大惡人尚能一生成就何況小惡何況無惡何況一生念佛之人豈不決定往生疑者云大惡之人臨終念佛十念往生皆是宿世善根深厚乃能如此釋云大惡之人宿世尚有善根何況小惡何況無惡何況一生念佛之人豈有無善根之理當知但能遇善知識聞佛名號皆是宿世善根深厚之人不可自生疑惑自障其心令一生空過道業無成余親見善友根機最利功行高超臨終生疑不得往生有愚鈍者老實念佛臨命終時即得往生可見淨土法門不論根機大小功行淺深唯在深信佛語皆得成就故慈照宗主云將謂是凡夫不得生淨土且自持齋戒後世願為人輾轉更修行方可生彼國多見修行人常作如是說不稱彌陀願不合淨土經邪見障覆心畢竟難出離非是他人障皆是自障心今世不得生一蹉成百蹉勸汝修行人信我如來說佛無不實語豈是虗誑言但當自精勤一心求淨土佛恩加被余庚午冬在旌教寺起七念佛因得小病便生疲倦不能提起心中胡思亂想忽然想著在家之時衣食難圖苦不可言今賴佛恩百事現成稍有微恙那堪放逸今逢如此良緣再不精進念佛豈有出苦之期因此忽爾新鮮神清氣爽念佛頗見有力因作厭苦出家念佛求生四偈以常警䇿自慚歷劫罪根深報在貧家做苦人衣食難圖多困厄親隣靡恃甚酸辛雖存藝業空無味賴遇病緣起厭心感佛慈悲垂救護願修大行度羣生造惡愚人忽作僧未知往昔有何因旱逢甘澤非吾福病遇良醫是聖勳大石將沉還不沒重囚臨死得回生願祈速出輪迴苦廣學菩提報佛恩幸得為僧異俗倫深慚垢重道難成胸中妄想紛然起意地貪嗔不暫停始學禪宗緣未就將修淨業病相侵哀哉寶所空無獲立誓專稱萬德名畢命為期誦佛名朝朝六萬定功程往生盡在專修志流轉咸由放逸心極樂人民皆不退娑婆豪貴亦沉淪唯求早託蓮池底免在閻浮受苦輪憶恩流淚同治庚午冬余在旌教寺裱一軸六字洪名供於室內於初掛之日竭力跪誦千聲以申誠敬忽憶萬德洪名救我死心之恩不覺聲淚並出因作偈云六字洪名妙莫測無邊功德皆含攝本師為此重重宣諸佛因斯處處說善導多稱多放光少康一唱一飛佛我今跪誦憶深恩句句聲聲淚並出慶領直捷彌陀要解云阿彌陀佛是萬德洪名以名召德罄無不盡徹悟禪師云一句所念之佛全德立名德外無名以名召德名外無德寄語持名行者當思此語始知持名不必參觀至簡易至直捷也余愧數年以來不解此旨隨伶俐人脚跟所轉妄謂彌陀名號曲為下根之人若上智念佛必要參究作觀方稱有禪有淨每懷此意究竟參又參不到觀又觀不成幸於辛未春而得解入彌陀三身之德恒稱名而頓彰圓中鈔云一稱嘉號萬德齊彰果有此妙自此參觀心絕慶幸之至若非父母勤苦之力讀兩年書識幾箇字那有今朝愧出家來並無酧薦遂然臂香四十八炷供養阿彌陀佛願我生身父母承此善根早生極樂因作偈云以名召德本融通彼佛分明在口中果得持名無異念聲聲露出紫金容手掐輪珠記佛名珠中有佛甚分明只因自己塵緣重終日於中不見形家貧已讀兩年書父母辛勤汗如雨今解以名召德宗全憑識字看經語臂上虔焚六八香至心供養彌陀佛以斯功德願雙親早脫苦輪生樂國惜前謬濫堪悲昔日墮偏空妄謂己明向上宗念著彌陀平淡淡自稱見地喜濃濃初出家時本信西一欣禪理反嫌低至遭兵難方知謬盡改從前一切非淨宗未入自稱通濫解彌陀即主翁雖說洪名吾喜念心中猶著沒西東我學恭禮只解空謬稱心淨即蓮宮至看十要明西有始決持名願捨東名號本願眾生垢重道難修苦海茫茫怎出頭法藏因斯立誓願但將名號度羣流彌陀名號願無邊普攝凡愚頓且圓惡逆回心纔十念火車化作紫金蓮持名自得洪名隱隱口中稱手掐輪珠靜靜聽聽得玄音明歷歷恍如有佛露真身開唇誦佛微微響攝耳澄心細細聽聽得佛音含淚出宛如難子哭慈親持名要策口誦佛耳聽聲句句應使勿暫停但得如斯無夾雜宛然有佛在其唇西齋詩云口耳相傳六個字聖凡不隔一條絲即此義也名一舉佛頓彰徹悟禪師云全德立名德外無名以名召德名外無德少康祖師功極於此故能稱一聲名出一尊佛聲聲全露自心光即徹悟云一聲佛號一聲心直下分明豈待尋鞭影不勞頻舉示白牛運出古黃全為茲不用雜參觀只要當人願力強堅密大師云六字洪名念念之間欣厭具足此即願力堅強之謂也持名重口持名重口義深深當究大乘圓頓經法華一稱皆作佛觀經十氣便超生洪名功大在音聲故得頓收惡逆根感應易成全仗此高賢慎勿看為輕持名當響我稱名號響如雷彼佛遙聞必速來只為念聲力小小故他緩緩送金臺我把彌陀盡力稱蓮池會裏必聞聲其中諒有舊親戚終肯早來送好音持名伏妄稱佛不宜記妄心最宜聽著口中音譬如白日濃雲起當幸陽光不被侵稱名伏妄有奇勳勳在口中出響聲譬若人間千怪起一雷能破眾邪心三業圓修口稱佛號必從心手掐輪珠正屬身三業圓修功必大故堪將此廣流行細想佛宣三藏經無非警誡修三業所以深勸稱彌陀聲聲圓淨易超越有佛土頌曾見學者將一卷彌陀經都說是自心本性並無彼佛彼土豈非撥境求心斬頭覔活余聞之不忍遂述有佛土頌以警童蒙大哉一卷小彌陀佛字算有八十五只見三心在厥中敢云無佛甯非忤土字覔成二十一徧尋性字無踪跡分明有土是圓談不比小乘多說寂自題小照本貧窮人是地獄種何福而遇出家何慧而知西方必蒙彌陀恩德之所加被既感佛恩當持佛名慚愧不能參究作觀不能平伏妄想只堪記數讀誦畢命為期而已曾有偈云感佛深恩誦佛名不修妙觀不參心任憑意地多思想誓掐輪珠動口唇問如此念佛有何奇特答念珠在手華池朗佛號離唇性地昏痛䇿依稀堅密大師云一句彌陀非大徹不能全提而最愚亦無少欠倘有些子分別便成大法魔殃只貴一心受持甯羨依稀解悟乞兒若見小利急須吐棄無餘崑向謂名號即佛豈非依稀又謂名號即心豈非分別如此小利那可不吐因然臂香九炷而述痛䇿云彌陀六萬定規繩日日堅持作路程不想白牛當處露只求臨死免沉淪朝數洪名六萬聲憑他微妙深非深不求彼佛今時現只想臨終得往生多劫以來積罪深持名一世豈能清必憑佛力垂加護使我臨終帶業生巍巍萬德紫金身纔誦洪名那得親必仗當人真信願臨終佛救始超昇吾人心性含諸妙信此求生終易到最怕於中解不忘雖持佛號功難效彼佛洪名度一切急須持誦休停輟當如遇難喊人援莫謂音聲便是佛難難難難難之極頓悟依然生苦域實為理明事不精故知重解反招躃易易易易易之至十聲佛號歸西去只憑一點願心堅故信洪名功莫喻深恩略讚一句洪名血滴滴當知法藏大恩力經無數劫結吾緣始肯今朝口不輟一句洪名血滴滴釋迦之苦如山疊捨頭捨目為吾身今日方能聽彼說一句洪名血滴滴六方盡出廣長舌為防吾信不能堅六道輪迴無可出一句洪名血滴滴祖師菩薩汗如血剖心竭力造諸書勸我必從者裏入古崑自發狂來苦有數載幸於此休故然臂香四十八炷供養彌陀釋迦六方諸佛及歷代祖師菩薩發願云我供臂香四十八微酧佛祖諸恩德願吾今世得超生盡未來時度一切佛前號哭同治庚午九月崑在旌教寺啟建七七道場每日持名十萬至圓滿日自慚空過佛前號哭云法門如此勝妙我罪如此深重為人如此心急慧辯如此愚鈍信願如此極力持名如此散動如此難得相應真實可悲可痛此偈乃佛前聲淚俱下之言倘有妄語自招舌真實哭有多次今特記出以告諸賢俾知我古崑雖盡心竭力窮究淨土妙旨不及愚夫愚婦老實念佛之人猶得一心不亂刺血暢懷我今刺舌血敬寫彌陀經諸佛應生喜彌陀必更欣我今刺舌血塗徧六方佛諒必共哀憐令吾生樂國我刺左手血書成六八願彌陀欲普收必定有吾分我刺右手血流歸九品池不分華大小必有我一枝老實念佛老實念彌陀蓮歸路直暫時生巧心即刻墮邪域老實念彌陀易離生死苦一貪奇妙功難到清凉所老實念彌陀應須不輟口聲聲如哭親恰恰朝西走老實念彌陀數珠休脫手日持幾萬聲在此終非久念佛慰進一句阿彌陀一顆大明珠在在勤抹拭處處寶光舒一句阿彌陀一把金剛劍日日持手中朝朝魔不現一句阿彌陀一條安養路步步向前行時時離穢土一句阿彌陀一分相好光念念常不捨刻刻近法王三業同運智者大師摩訶止觀云步步聲聲念念唯在阿彌陀佛因述四偈而為警䇿時時近佛繞步步出塵牢日日常如是往生位必高開口誦彌陀聲聲莫間斷承斯往樂彼佛必先喚欲離煩惱纏念念休忘佛不假諸功勳速超安樂國欲成微妙德唯在阿彌陀三業同時運得功易且多繞佛偶成口稱彼佛名身向彼方走可恨貪嗔癡不能隨我後願心欣西走妄想好東遊賴有彌陀力終能到寶樓持名要切洪名口口稱生死聲聲哭願佛大慈悲令吾歸去速願師生蓮崑深愧在俗之時貧苦無依誤歸外道幸遇普甯堂上上滌下凡茂老和尚救度出家今聞去世是故敬然臂香四十八炷供養阿彌陀佛發願云我然六八香供養彌陀佛願我剃度師早生極樂國掩關警䇿余有同學於旌教寺掩關說法甚勤為人甚切只恐利人太早有損於己況凡夫習氣名利難輕情愛易熾雖然志在淨土無奈力量未充因忝在知心同為生死故述八聯示之願共警䇿掩關本避人情亂定課原防世事纏六字洪名應努力三時淡飯可隨緣識性不嫌羮味苦知心何用語言甜順境亂心多罣礙逆緣助道少牽連法愛不輕功不熟人情難淡道難全名聲愈廣情愈重利養越多愛越堅勸人恐惹人情縛說法防招法愛牽癩客醫瘡真可笑破舟救溺實堪憐䇿不相應嘗見淨友根機稍利最好稱能常說厭娑婆欣極樂人命無常光陰有限而所行之事全不相應余因此自省習氣相同遂作兩聯以自警䇿省庵法師云雖有好心多為名利之所夾雜雖有善法復為罪業之所染污可不慎乎聯云真欣極樂逍遙彼佛洪名當緊誦實厭娑婆苦惱自身能處不宜稱既知人命無常外事紛紛林再管果信光陰有限內心亂亂急須平讚佛聯對苦海風狂真可怕必依教主之言始得速離此岸愛河浪險實堪愁終靠導師之力方能早到他鄉娑婆教主悲願宏深誓度苦人離火宅極樂導師慈心廣大常迎迷子入蓮池黃金地上寶樹重重盡是修行者種白玉池中蓮華朵朵無非念佛人栽日日執華臺處處去迎念佛者朝朝垂寶手時時來接信心人我口裏纔唱明幾聲佛號彼池中便高了數寸蓮華暫禮金容三身圓現壹稱嘉號萬德齊彰白毫徧攝微塵剎紺目常窺大地人華臺迎接無疑士寶手提𢹂有願人聖號暫稱功莫測凡心雖亂妙難量一聲佛號微微誦七寶蓮華大大開覺號在唇唇有佛清珠存手手無塵稱洪名蓮華燦爛起惡念劍樹魏峩六方佛出廣長舌三界人歸安樂家入此門來當念佛行其路去莫忘西門對淨土隨學新刻緣起淨土隨學一書乃戀西大師深念佛恩剖心瀝血之言其中闡揚淨土妙義罄無不盡非但言真行實令人易起深信而且文簡理明令人易發大願信願既備則持名一行不勇自勇如禮想與八觀將二經之本旨次第指陳徑路及開心將淨土之正宗分明拈出非善導親承堅密面授豈有是哉十一序文或引初心而別垂方便或宏淨要而細剖幽微皆依聖教發揮慈心湧出十篇發願或感深恩而立誓上求或懺重罪而發心下化可謂將此深心奉塵剎是則名為報佛恩至若有佛土頌破心性無佛無土之偏邪痛䇿依稀救名號即佛即心之混濫乃別出心裁對病發藥且平常且奇特非透徹靈峯堅密之意安有此作以及深恩略讚刺血暢懷種種偈等莫不為被時機瀝枯心血幽玄文至警䇿之極夫此書者真可謂救病神方生西妙訣故能令我障重之人於持名法門深起信願死盡偷心自𫎇曉法師指我見師於佛頂山至今十有餘載所承法恩不可思議非盡未來際助師行化安能酬報也哉乙亥夏有西舲上人自涔陽遠訪至紹一見此書殷勤稱讚再四勸師流通結緣遂題詞於卷首又淨友本緣對余曰某甲得解魔纏仗隨學力遂出錢貳拾千復行倡募願廣流通以報深德書名隨學隨者講也學者信也師具此謙信二德將來往生必早見佛唯願淨業之士咸隨此學學到如師信願切定隨師後見彌陀隨學二字甚深甚深可知吾師一生苦志都回向在隨學二字故自序云願承此隨學善根早得見佛聞法早能說法利生即普賢菩薩常隨佛學恒順眾生之願也時光緒元年臘月弟子妙能芳慧在旌教寺敬然臂香四十八炷稽首謹識往生要關附余每見修淨業者說著現世往生多疑心不決非疑業障深重即疑功行淺薄人人易犯此病箇箇難逃此關何哉皆因不知彌陀願力特於苦處生悲故也余壬申夏至虞見戀西大師要關之旨不怕𫎇障重只愁信力微不嫌功行淺最忌心自退此深契彌陀普收之願諸佛廣讚之心可謂破夜明燈過河要筏欲往西者必不可少遂發心付梓并印千張以結淨緣今刊神珠又附於後普願見者聞者知其勝異方便不被此一疑而失千萬劫難逢之奇遇也芳慧識要關云念佛之人將往生時最怕心懷疑惑自生退屈謂我等生死凡夫罪障深重豈能一世便得往生此皆不知彌陀願力特為救度苦惱眾生一生成就而設此方便也觀經云十惡五逆臨終苦逼教稱十念即生彼國此豈非一生成就之明證乎十惡五逆乃極大惡人尚能一生成就何況小惡何況無惡何況一生念佛之人豈不決定往生疑者云大惡之人臨終念佛十念往生皆是宿世善根深厚乃能如此釋云大惡之人宿世尚有善根何況小惡何況無惡何況一生念佛之人豈有無善根之理當知但能遇善知識聞佛名號皆是宿世善根深厚之人不可自生疑惑自障其心令一生空過道業無成余親見善友根機最利功行高超臨終生疑不得往生有愚鈍者老實念佛臨命終時即得往生可見淨土法門不論根機大小功行淺深唯在深信佛語皆得成就故慈照宗主云將謂是凡夫不得生淨土且自持齋戒後世願為人輾轉更修行方可生彼國多見修行人常作如是說不稱彌陀願不合淨土經邪見障覆心畢意難出離非是他人障皆是自障心今世不得生一蹉成百蹉勸汝修行人信我如來說佛無不實語豈是虗誑言但當自精勤一心求淨土
