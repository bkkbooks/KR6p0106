body:
  text: 戀西學人玉峯古崑自編夫障重眾生道業難成最可哀矣古崑本發真實心棄捨雜業專持佛名欲求現世脫苦誰知於持名中又起種種我見好揚己解向來不習文字而今偏喜亂作豈非顛倒況古人妙典堆積如山今更作之真是棄摩尼求瓦礫自喪實德貽笑諸賢總因生死不切故被此魔擾亂至同治癸酉春因撰述而得重病始知障道非淺恨意馬難止遂立誓戒之後因舊願未了觸事昏迷猶有破犯若不懺悔必成惡障是故於乙亥年佛降生日敬然臂香九炷發露懺悔重立誓云無文好作甚堪耻自恨貪心難制止立誓今生再不為再為即是逆佛子遂將自警錄及一生醜拙會集一本以便自覽而常警䇿名淨土隨學者乃隨信力勉強之所學也信者信佛恩加被乃能入此法門所以頓忘鄙陋種種出醜惜數年中為此一事日夜不安勞心費力苦不可說是故於編稿畢敬然臂香四十八炷供養阿彌陀佛發願云願我承此隨學善根早得見佛聞法早能說法利生光緒元年歲次乙亥季夏日後學古崑書於法源庵之報恩關時年四十有八佛說阿彌陀經禮想儀後學古崑遵古略輯經云佛告舍利弗若有善男子善女人聞是經受持者及聞諸佛名者皆為一切諸佛之所護念皆得不退轉於阿耨多羅三藐三菩提是故舍利弗汝等皆當信受我語及諸佛所說故知此經不可思議乃諸佛心要法門綱宗其辭簡而理明其文約而事備字字是行人真歸字字是行人妙觀但得聞名便登不退皆為諸佛護念何況受持也哉崑未出家時首獲此經迨閱要解始知深妙從茲發願受持志求淨土夫淨土莊嚴甚深微妙非是凡夫心力所及唯此經依正稍近凡情乃彌陀大願接引下凡之異方便也故云眾生聞者應當發願願生彼國所以者何得與如是諸上善人俱會一處此勸下凡往生得與上聖同居法門勝異全在於斯諸佛稱讚皆為此也謹遵時公受持行儀略輯禮想儀軌以堅信願經中大意分十二科依科唱禮隨經默想恭對西方如在目前雖依正不能明了而信願已真如是一心持名則空有同彰理事備焉釋迦及十方諸佛同聲勸信可不勉哉當知此經的是樂家書彼國莊嚴無非自家故物彌陀慈父待己多時操此求生而萬牛莫挽矣同治己巳秋識於旌教寺之天台教觀行者凡禮想時先跪佛前燒香合掌云願此香煙雲徧滿十方界供養一切佛世間難信法及諸上善人普熏諸眾生皆發菩提心即起禮佛一心頂禮娑婆世界五濁惡世說難信法本師釋迦牟尼佛拜下默想經文一節云舍利弗如我今者稱讚諸佛不可思議功德下至是為甚難止一心頂禮十方世界出廣長舌勸讚西方恒河沙數諸佛舍利弗如我今者讚嘆阿彌陀佛不可思議功德之利下至上方一切諸佛所護念經止一心頂禮西方極樂世界光壽無量普攝群生阿彌陀佛舍利弗於汝意云何彼佛何故號阿彌陀下至於今十劫止一心頂禮西方極樂世界執持名號臨終導引阿彌陀佛舍利弗不可以少善根下至應當發願生彼國土止一心頂禮西方極樂世界己今當願皆令往生阿彌陀佛舍利弗若有人已發願下至生彼國土止一心頂禮稱讚不可思議功德一切諸佛所護念經及十方三世一切尊法舍利弗於汝意云何何故名為下至及諸佛所說止一心頂禮西方極樂世界觀音勢至諸上善人及清淨大海眾菩薩摩訶薩又舍利弗彼佛有無量無邊聲聞弟子下至俱會一處止一心頂禮西方極樂世界靈鳥樹下聞音正念諸菩薩摩訶薩復次舍利弗彼國常有種種奇妙雜色之鳥下至成就如是功德莊嚴止一心頂禮西方極樂世界黃金地上盛華供佛諸菩薩摩訶薩又舍利弗彼佛國土常作天樂下至功德莊嚴止一心頂禮西方極樂世界蓮華池內寶樓閣中諸菩薩摩訶薩又舍利弗極樂國土有七寶池下至功德莊嚴止一心頂禮西方極樂世界無有眾苦但受諸樂一切菩薩摩訶薩爾時佛告長老下至是故彼國名為極樂止一心頂禮文殊彌勒諸大菩薩舍利弗等諸大尊者及十方三世一切聖眾如是我聞下至無量諸天大眾俱止禮想已跪誦彌陀經一卷往生呪三遍讚云阿彌陀佛身金色相好光明無等倫白毫宛轉五須彌紺目澄清四大海光中化佛無數億化菩薩眾亦無邊四十八願度眾生九品咸令登彼岸南無西方極樂世界大慈大悲阿彌陀佛稱佛多少隨力而止南無觀世音菩薩南無大勢至菩薩南無清淨大海眾菩薩各十稱念畢回向發願云弟子稱念阿彌陀真實功德佛名號唯願慈悲垂攝受證知懺悔及所願我昔所造諸惡業皆由無始貪瞋癡從身語意之所生一切我今皆懺悔願我臨欲命終時盡除一切諸障礙面見彼佛阿彌陀即得往生安樂剎我今所修諸善根一切皆悉盡回向普願法界諸眾生同生西方極樂國自歸依佛當願眾生體解大道發無上心自歸依法當願眾生深入經藏智慧如海自歸依僧當願眾生統理大眾一切無礙和南聖眾禮想儀者每日欲修幾時隨力可耳但早晚二時決不可少末後一時佛數念完佛前長跪合掌先誦四十八願再念觀音勢至清淨海眾發願回向或禮拜四十八願更好當合掌定心如對佛云一心頂禮西方極樂世界大慈大悲大願大力接引導師阿彌陀佛念畢拜下想第一願設我得佛國有地獄餓鬼畜生者不取正覺禮第二拜想第二願亦如是禮觀音勢至及大海眾菩薩各三拜照前發願回向三歸依畢阿彌陀經頌從是西方有樂城彌陀說法正當今七重樹覆珍珠網自在逍遙絕苦輪七寶池中德水盈蓮華香潔底純金四邊階道琉璃合樓閣層層瑪瑙成黃金地上每經行天樂時時奏法音適意妙華盛滿裓他方佛國任飛升靈禽樹網出玄音晝夜常宣三寶名見色聞聲生正念菩提道果自然成萬德圓融相好身光明徧照攝羣生壽同人命不思議故號名為無量尊無數聲聞與上人常居一處若同倫凡夫到此皆無退聞者應當發願生依正莊嚴無等倫雜修福善豈能生一心不亂持名號化佛來迎道果成濁惡娑婆說此經十方廣舌勵羣生應當諦信無疑惑功德莊嚴念念成此經功德妙難思金口殷勤勸受持但得聞名佛護念是人永不退菩提欲往彌陀安養城己今當願盡超生如斯圓頓難思議只在當人信力深五濁眾生業垢深非持名號道無成本師行此甚難事諸佛同舒廣舌輪徹底悲心自說經特垂方便攝三根文殊身子皆聽受我等人人當奉行阿彌陀經乃淨土最要之典有緣遇此不可輕易此頌全依經中要旨而述非敢臆說讀者宜靜心思察不可草草方知釋迦及十方諸佛為我等苦惱眾生慈悲救濟恩德如此具佛性者可不信乎唯願同行之士極力奉持仗此功德早生西方附勸誦經偈梁朝有一道珍僧僧講大經數十春雖見西船不得去只因未誦彌陀經臨睡入觀禮誦儀後學古崑遵古略輯觀無量壽經云佛告阿難及韋提希諦聽諦聽善思念之吾當為汝分別解說除苦惱法汝等憶持廣為大眾分別解說說是語時無量壽佛住立空中觀世音大勢至是二大士侍立左右光明熾盛不可具見百千閻浮檀金色不得為比余因此確信釋迦如來與阿彌陀佛在因地中同發慈悲之願同開折攝之門所以本師纔說除苦惱之法彼佛便垂具莊嚴之身合韋提希等欣淨之意濃而又濃厭穢之心切而又切其實韋提希等並未作觀但深厭娑婆世界之苦惱大欣釋迦本師之悲訓而已智者大師云欲決定得生西方須具欣厭二行誠哉此語真得韋提夫人往生之妙訣矣故知障重眾生欲修佛觀者只要深信釋迦折伏之言而生其厭專慕彌陀攝受之德而生其欣至心向西頂禮佛必遙知臨命終時定來接引實則現在依經向禮現已感佛近前眾生障重自不解耳感應之道其理必然為此依觀經之言遵時公之式略輯臨睡八觀禮誦儀禮者禮彼佛神通如意變現自在之身誦者誦本師分別解說斷除苦惱之法修淨業者必須遵此始知二佛願力同化眾生慈悲如此九品儀者乃鄙見謬撰續入因得下品惡人稱佛之益是故禮之以䇿自疑障深功淺恐難往生之退屈心耳同治庚午冬識於旌教講寺之讀佛軒行者一日佛事圓畢當向佛前修如是法一心頂禮娑婆世界分別解說除苦惱法本師釋迦牟尼佛拜下想偈云能禮所禮性空寂感應道交難思議我此道場如帝珠釋迦如來影現中我身影現如來前為求離苦接足禮一心頂禮西方極樂世界在池水上住寶蓮華現丈六身形真金色圓光映徹圓光中無量化佛菩薩阿彌陀佛想偈云能禮所禮性空寂感應道交難思議我此道場如帝珠阿彌陀佛影現中我身影現彌陀前為求徃生接足禮一心頂禮西方極樂世界在池水上天冠立佛觀世音菩薩摩訶薩想偈改觀音菩薩影現中一心頂禮西方極樂世界在池水上肉髻寶瓶大勢至菩薩摩訶薩想偈改勢至菩薩影現中一心頂禮極樂世界上品上生讀誦修慈三心圓發諸菩薩摩訶薩拜下默想本品經文云云下例此或不想經文但至誠向禮亦可一心頂禮極樂世界上品中生解第一義心不驚動諸菩薩摩訶薩一心頂禮極樂世界上品下生但發無上清淨道心諸菩薩摩訶薩一心頂禮極樂世界中品上生修行諸戒無眾過患諸菩薩摩訶薩一心頂禮極樂世界中品中生一日一夜持戒威儀諸菩薩摩訶薩一心頂禮極樂世界中品下生孝養父母行世仁慈諸菩薩摩訶薩一心頂禮極樂世界下品上生多惡稱佛三聖慰迎諸菩薩摩訶薩一心頂禮極樂世界下品中生毀戒聞佛火滅聖臨諸菩薩摩訶薩一心頂禮極樂世界下品下生惡逆稱佛十念得超諸菩薩摩訶薩拜想已長跪合掌誦佛說觀無量壽佛經雜想觀九品觀須尋西歸行儀及蓮宗必讀誦至當坐道場生諸佛家至心竭力念南無阿彌陀佛十口氣南無觀世音菩薩南無大勢至菩薩南無清淨大海眾菩薩各十聲發願云弟子某甲現是生死凡夫罪障深重輪迴六道苦不可言今遇知識得聞彌陀名號本願功德一心稱念求願往生願佛慈悲不捨哀憐攝受弟子某甲不識佛身相好光明願佛示現令我得見及見觀音勢至諸菩薩眾彼世界中清淨莊嚴光明妙相等令我了了得見禮佛三拜歸寮養息九品觀章頌圓發三心誦大乘修行六念并慈心以斯功德求生彼佛聖無邊至此迎上品上生大乘不謗因果明又解經中第一義三聖親臨千佛隨同時授手迎歸去上品中生但發菩提求極樂臨終三聖即來迎五百化佛同時至皆讚行人發上心上品下生修行眾戒無諸過以此善根願往生臨死彌陀來讚說出家定得脫酸辛中品上生一日一夜持眾戒威儀無缺有深勳故蒙彼佛來稱讚因順經言得往生中品中生能行孝養及仁慈最後又逢大善師聞說彌陀宏願力屈伸臂頃到蓮池中品下生愚人無愧造多惡臨死能稱彼佛名三聖忽然隨念至慰言罪滅我來迎下品上生毀戒之人將墮獄忽逢知識讚洪名聞斯即滅無邊罪猛火遂消三聖臨下品中生五逆十惡罪極深臨終值遇善知識教稱十念阿彌陀即見蓮華來迎接下品下生九品頌者但頌其修行之因生時之緣下三品本皆惡人臨終暫修稱佛洪名之因應時即值佛來迎接之緣豈有圓頓勝過於斯彌陀願海攝受惡人慈悲恩德乃至如此故知只怕不念佛不愁不往生惡人臨終暫修尚感佛來況無惡者一生念佛臨終佛豈不救故智者大師云火車相現一念改悔尚得往生況戒定熏修淨行道力功不唐捐此九品行相乃障重眾生入佛知見之大方便門專淨業者不可不熟也古崑幸獲此章之益始想一生成辦是故頌畢敬然臂香九炷供養九品善人願我速脫輪迴早登下品因念佛時心多散亂故西方徑路決疑䇿進不肖古崑愚癡下劣染心熾盛於諸法門莫能希冀唯持名一行最極方便惡逆愚人悉皆收攝省庵法師云彼佛願力獨超卓不遺五逆并十惡信願持名苟不虧他年定向蓮華託因此發願專持名號無奈宿習偏強心猿難制謹將彌陀名號及佛祖要言述成四十八偈以為鞭䇿并深信佛願決志求生善導祖師云唯有徑路修行但念阿彌陀佛故以西方徑路決疑䇿進名焉智者十疑論問決定求生西方未知作何行業以何為種子得生彼國答欲決定生西方者具二種行定得生彼一厭離行二欣願行遵此謹述欣厭二門為徑路之先導也讚佛起欣娑婆教主開淨土門甚難希有至頓至圓十方諸佛廣舌同宣殷勤稱讚勸勵眾生極樂導師光壽無邊慈悲攝受九品同登千經共指萬聖同遵橫超三界唯此一門自警生厭生死事大無常迅速一失人身萬劫難復暫寄人間常居地獄苦報無邊始因三毒情愛牽連自纏自縛不起厭心何時可脫法門無量誠難凑泊一心念佛定生極樂徑路䇿進一句阿彌陀徹底悲心說聞此難信法當願生彼國一句阿彌陀諸佛所護念聞名及受持皆得不退轉一句阿彌陀六方同稱宣出廣長舌相勸勵諸眾生一句阿彌陀釋迦叮嚀說皆當信我語及聽於諸佛一句阿彌陀光明照十方普攝念佛人同登極樂一句阿彌陀壽命不思議及其諸人民一切皆無異一句阿彌陀具足妙莊嚴上善同聚會生者無退緣一句阿彌陀信者當發願持名便往生即是多福善一句阿彌陀法藏宏誓攝十念不往生我終不作佛一句阿彌陀願力實難量臨終獄火現十念往西方一句阿彌陀無量功德力大石置船上必定不沉溺一句阿彌陀罪除無量劫聞名尚離苦何況憶念切一句阿彌陀末法緣最深餘行難成就唯此獨超倫一句阿彌陀諸佛異方便欲生安養國應當專心念一句阿彌陀華嚴極讚揚文殊普賢等咸願生彼方一句阿彌陀千經萬論宣彼佛與我等宿有大因緣一句阿彌陀慧遠知幽玄功高極易進念佛最為先一句阿彌陀智者垂遺言惡逆尚往生淨行不唐捐一句阿彌陀善導詮二門專修人人去雜行却難生一句阿彌陀承遠行不休勸化至萬人皆同如是修一句阿彌陀法照問文殊唯此一法門最應末世機一句阿彌陀少康願無易以錢誘小兒普勸皆念佛一句阿彌陀智覺登初地料簡有淨土萬修萬人去一句阿彌陀慈雲有至訓十念最切要當生決定信一句阿彌陀省常立淨行諸賢同結社大開念佛門一句阿彌陀蓮池具正見臨終垂慈誨只要老實念一句阿彌陀幽溪闡妙理我此念佛心法界圓融體一句阿彌陀蕅益深得意一生補佛位尚能帶業去一句阿彌陀堅密應時說痛言三大要第一欣厭切一句阿彌陀省庵作詩說六字出乾坤不用三祇劫一句阿彌陀徹悟垂遺訓一稱佛洪名一分相好現一句阿彌陀祖祖相傳說佛號投亂心亂心即成佛一句阿彌陀括盡三藏底下凡例上聖此法更無比一句阿彌陀普被諸眾生咸令登不退九品隨機分一句阿彌陀感應難思議散心稱佛名皆登安養地一句阿彌陀快哉佛助喜疑惑中悔者亦生邊界裡一句阿彌陀五道橫超出十稱尚成就況念千萬億一句阿彌陀纔稱已種蓮念念不離心其華時時鮮一句阿彌陀不假方便力憶念心不亂華開即見佛一句阿彌陀全憑信願切念佛多散亂九品皆收攝一句阿彌陀救護悲心切十惡五逆人皆令生彼國一句阿彌陀恩德深無比令我種善根直至補佛已一句阿彌陀佛界因緣起跡未離娑婆神棲蓮華裏一句阿彌陀昇道無窮極易往而無人哀哉甚可惜一句阿彌陀無上大醫王能治一切病不信實堪傷一句阿彌陀苦海大慈航人人肯登舟個個到西方一句阿彌陀神力不可測八哥稱佛名皆生極樂國一句阿彌陀萬德慈悲父願我與眾生速往安樂土徑路決疑銘我佛如來眾聖中尊垂異方便圓攝三根但持名號佛國便登一音普被十剎同宣文殊普賢咸願往生馬鳴龍樹皆悉欽遵千賢萬聖同入此門疑惑不信地獄火坑佛功德海深廣莫測眾流同赴一切俱攝彌陀名號成就萬德普度羣生同登彼國將墮猛火暫稱頓息已入泥犂聞名便出感應昭彰莫能盡述但肯迴心苦海橫截發願受持同治八年九月十五日於天台教觀西軒然臂香十二炷供養佛說阿彌陀經發願每日誦經六卷稱佛號六萬聲畢生為限因此思惟釋迦本師憐念我等於五濁惡世開往生門彌陀慈父憐念我等發六八大願莊嚴淨土六方諸佛憐念我等出廣長舌相同聲勸讚故知十方如來憐念眾生如母憶子從曠劫來未曾暫捨自恨愚癡捨父逃逝沉淪多劫不覺心酸悲泣流淚因作偈云憶想西方兩淚淋悲傷多劫負慈尊莊嚴功德皆成就無奈娑婆業海深樂家信本師通諸佛相援路不壅慈父倚門常挂念可憐迷子太朧西方極樂本吾鄉多劫漂流已盡忘幸得能仁通信息始知慈父在家堂纔思極樂便心酸可厭娑婆苦萬端慈父多時懷念我從今切莫更遊觀勸持經念佛佛說阿彌陀經者乃釋迦本師及六方諸佛徹底悲心為我等濁惡眾生說彼清淨佛土殷勤勸往阿彌陀佛乘大願力接引娑婆世界念佛眾生法門勝妙讚莫能窮金口誠言皆當信受一卷阿彌陀契經十方諸佛大悲心但憑此道超生死萬德功歸彈指成八萬四千妙法門彌陀一句最為尊十方盡出廣長舌同讚西方勸往生徹底悲心為甚麼殷勤只勸念彌陀娑婆苦海風濤險白蕅華中快樂多壽量光明讚莫窮無邊世界攝羣蒙但能一念生歸敬博地高登極樂宮天台徹證自心源親見靈山事儼然坐不背西常念佛臨終但舉樂緣永明宗匠出羣賢理事融通心鏡懸萬善同修歸淨土十人九錯是空禪善導遺風千古傳勸人念佛要精專當知徑直修行路一句彌陀最勝緣懷玉金臺志願堅銀臺雖現不從緣平生實行無他事朝念彌陀五十千彌陀一句法中王雜念紛紛也不妨萬里浮雲遮赫日人間處處有餘光要解云淨土殊勝謂帶業生同居淨此全籍彼佛光明願力也雜念紛飛實可哀千般計䇿莫能排那知一句彌陀佛不斷凡情入聖胎天如云深信佛力雖具惑染亦得徃生故有帶業橫超之說彼佛因中願行高嚴成寶土為吾曹但稱十念超生去受用何曾減一毫法藏願云欲生我國乃至十念稱名若不生者我不成正覺法門特出甚奇哉惡逆凡夫達聖階獄火現時憑十念臨終端坐寶蓮臺蘧庵云夫念佛三昧不擇賢愚貴賤不論久近善惡唯取決定信心臨終惡相十念徃生此乃凡愚下類剎那超越成佛之法永明所謂奇哉佛力難思古今未有也即心念佛頌幽溪大師圓中鈔以極樂依正為妙有一心持名為真空微真空而莫能證於極樂之妙有微妙有而莫能顯於此心之真空合二義作頌曰即心念佛佛號聲聲空合空宛然依正在其中一輪皓月千江現了了分明絕點踪心包剎海量無邊極樂明明在目前一句彌陀纔繫念己今身住玉池蓮念念彌陀念念心聲聲喚醒本來人當知彼佛威神力攝取羣生誓海深一句彌陀一數珠珠珠相映寶光舒互含互徧難思議苦海橫超極樂居念佛述懷嘗見禪者輕念佛法門為愚夫愚婦勾當作此聊由鄙懷同治己巳書於白沙泉之護國寺莫輕念佛是愚蒙達者還須入此宗一句彌陀全體現何消更覔主人翁一句彌陀深妙禪六方諸佛說誠言離斯更覔西來意流落他鄉五十年五十年喻五道出法華經口誦彌陀手掐珠拈花微笑有何殊等閒破無生面極樂莊嚴總是渠向上機關不較多只消老實念彌陀庭前栢子西來意六字洪名是甚麼念念彌陀惺寂寂山河大地非壅塞無邊剎土現其中他佛還從心想出彌陀念念寂惺惺彼佛宛然即我心極樂現時本性現自他不隔一纖塵我念彌陀未幾秋彌陀念我願無休不拘罪業誰輕重只要持名便往遊朝朝暮暮念彌陀念得心酸淚轉多八苦交煎直痛切未知何日離娑婆淚出痛腸事若何聲聲哭告老彌陀漂沉生死經多劫願我今番越愛河心猿意馬最難停曠劫奔馳直到今靜念彌陀猶不息從茲記數要分明輪迴生死最堪憂急急須尋徑路修法法思來機不契彌陀名號正相投稱佛一聲萬德周何須離此向他求但能念念休忘却教海無邊六字收念佛偶成娑婆教主號能仁普度羣生方便深說法五時分頓漸隨機化導出迷津末世眾生實可憐醫王出現恨無緣幸垂一滴真甘露入口能令萬病痊娑婆苦海苦如輪苦去苦來苦不停苦死苦生真實苦刀山劒樹苦尤深極樂逍遙絕比倫盤桓都是聖賢親黃金色相無窮壽寶地經行天樂鳴吾心廣大妙難量極樂莊嚴是故鄉句句彌陀頻喚母早來携我入華堂彼佛悲心不可量娑婆苦海泛慈航常思蕩子登舟去各各同歸極樂鄉稱一洪名哭一聲朝朝哭向大慈尊這迴若不歸家去六道何時得脫身稱一洪名行一步時時行著家鄉路可憐蕩子不回頭終日忙忙常背父面西端坐想池樓極樂宛然在屋頭無奈終朝常間斷皆由往昔未曾修遙瞻極樂想慈容歷歷分明在眼中可恨多生不會面今朝雖見却難通西方淨土即唯心欲識唯心須往生親見寶林宣妙法始知物物總家珍本性彌陀丈六身巍巍端坐寶華輪往生彼國分明見却是吾家舊主人無上深妙禪大集經云若人但念阿彌陀是名無上深妙禪至心想像見佛時即是不生不滅法故知禪淨一體理事無殊多見世人妄分是非執禪謗淨可不痛惜聊述愚懷以自勉耳一句阿彌陀無上深妙禪即是不生滅如來親口宣一句阿彌陀微妙最深密淨名默無言遠摩云不識一句阿彌陀西來的的意不必問如何只消驀直去一句阿彌陀碧潭空界月了了分明現畢竟非他物一句阿彌陀虗空皆消歿徧滿十方界覔之不可得一句阿彌陀萬法悉皆如巨海入毛孔芥子納須彌一句阿彌陀無生真妙訣本來怡恰是弄巧反成拙一句阿彌陀十方母憶子癡兒向外求苦痛何時止一句阿彌陀最勝摩尼寶能滿一切願速成無上道一句阿彌陀諸佛皆稱讚功德難思議切莫生輕慢供奉佛名阿彌陀佛本願云十方眾生聞我名號願生我國不果遂者不取正覺彌陀經云不可以少善根福德因緣得生彼國聞說阿彌陀佛執持名號即得往生觀經云惡逆眾生臨終應墮地獄教稱十念南無阿彌陀佛即變獄火而成蓮華又經云法滅之時經典全無但留阿彌陀佛四字名號救度眾生其有不信而毀謗者當墮地獄具受眾苦故知彌陀名號乃末世救急之良藥也況我古崑生在末世業障最重聞此佛名不得不尊重而力行之是故發至誠心請蓮根淨友大書南無阿彌陀佛六字洪名以便終身供奉并感李崇西居士發心塗金裝裱而共成之歡喜無量感激之至故於張掛之日敬然臂香九炷至心發願云稽首阿彌陀歷劫慈悲父存此萬德名流徧十方土我昔何因緣今朝得逢遇雖只六字名却與身無二以此度眾生願深莫能喻現生欲脫苦離此無是處是故然臂香至誠發宏誓盡此一報身供奉終不棄今日纔張掛跪對厲聲誦願我命終時必與今日共願同書寫人及與塗金者今世同往生永劫不相捨願諸見聞者各各生恭敬各各願受持各各決定信願以此功德速往極樂國親見阿彌陀如佛度一切淨土法門總讚妙哉眾生心皆有諸佛性若無增上緣隱覆終不現法王無上尊為此一大事廣設多方便助顯佛性義小智樂小法不堪聞大乘方便說小教權指寂滅城雖說三乘法究竟為佛乘欲令易成就特開淨土門廣演華嚴教大心皆踴躍末後十願王回向生極樂彼佛大願力超勝十方國依正妙莊嚴功德無倫匹一音纔舉揚十方皆稱說如此妙法門成佛之秘訣但能一念信必定當成佛念念念佛時念念已成佛佛德實難量讚嘆心莫及盡力說數偈如毛沾海滴願我同行人輾轉相傳說仗此最勝緣速往極樂國阿彌陀佛立華池讚極樂世界七寶池池中蓮華無數量有大寶華高湧出阿彌陀佛住華上神通變現丈六身微妙莊嚴金色相圓光映徹逾琉璃化佛菩薩悉無量白毫瑩淨放光明攝取眾生歸安養觀音侍左勢至右九品往生咸瞻仰彼佛神力不思議十方諸佛皆讚嘆我今憶念佛神通願命終時登彼岸慕西方樂七寶池邊聽法音琉璃階道任遊行仰觀池上蓮華裏盡是娑婆念佛人樓閣層層眾寶成光明映徹了無塵法王於此談玄理諸上善人笑滿盈天樂空中晝夜鳴天華隨處落繽紛黃金地上經行者都是盛華供佛人寶網重重覆樹林鳥鳴風動出玄音眾生到此心安樂坐臥常稱佛法僧厭娑婆苦三界無安若火坑人人處此被燒焚縱饒作善生天上福盡還歸地獄門樂事由來是苦緣愚人貪著甚拳拳暫時豪貴多招業死後仍投獄卒前色身虗假是深冤百計安排亦枉然老病相侵尤可畏死時䏺脹臭熏天情愛牽連切骨讐令人常被死王勾不求彼佛生安養六道輪迴怎出頭取捨然指文弟子古崑從無始來至於今生造無邊罪受無量苦今得人身三毒仍熾將來必定更墮三途從苦入苦無解脫期今始覺知可悲可痛念十方佛有大福慧能救拔我及諸眾生若機感不專聖應莫顯故於今日至心發願敬然二指又然頂香十炷供養十方世界勸讚西方恒河沙數諸佛唯願大慈大悲同垂證明哀憐攝受一指供養娑婆世界本師釋迦牟尼佛願我早捨娑婆之苦盡未來際廣度眾生同捨此苦一指供養西方極樂世界阿彌陀佛願我早取西方之樂盡未來際廣度眾生同取此樂虗空有盡我願無窮法界眾生同圓種智願現世之中善根增長不失淨因臨命終時身心正念視聽分明面奉阿彌陀佛觀音勢至諸菩薩眾手執華臺接引於我一剎那頃生極樂國華開見佛即聞佛乘頓開佛慧廣度眾生滿菩提願結壇持名彌陀經云從是西方過十萬億佛土有世界名曰極樂其土有佛號阿彌陀今現在說法諸上善人俱會一處無有眾苦但受諸樂彼佛願力不可思議若有聞者執持名號臨命終時皆得往生況十方如來示大舌輪殷勤勸勵娑婆教主告誡叮嚀其辭激切我雖愚癡難調難伏諸佛悲憐必得成就是故仰憑佛語結七七淨壇六時禮誦一意持名每逢七首敬然臂香十二炷供養佛說阿彌陀經及一切三寶發願云云依然指文解七懺願偈稽首無量光慈悲願無盡至心稱佛名感應隨時現我今發誠心仰遵諸佛訓持名經七七未曾見感應皆由宿業重使我心無定念佛多散亂哀哉真大病賴有佛慈悲散稱亦成聖是故不捨離終身志決定今重然臂香供養聖中聖懺悔無始業皆令速清淨仰願蓮池會佛及諸賢聖哀憐攝受我臨終垂顯應今世得往生報恩終無盡眾生皆作佛我願方畢竟普願諸善友西方決定信凡有見聞者各各生欣慶題讀佛軒余愧薄福多障身雖出家心不染道而生死輪迴可悲可痛雖淨土有橫超方便而古德開示念佛必要參究明白一心不亂始得成就此亦非易事余雖篤奉斯道無奈正念佛時心中偏想別事種種壓捺莫能暫停可不哀哉賴有彌陀願力九品齊收臨終苦逼心中不能念佛口稱十聲亦得往生法華經云散心一稱皆成佛道十稱一稱功德尚爾況復終身受持讀誦憑此決志不論解與不解散與不散每日讀誦阿彌陀佛六萬聲以作淨土資糧如川流赴海定不虗棄因題其居曰讀佛軒并作偈繫之讀誦西方六字經不參禪理不求心憑他妄念紛紛亂且盡平生弄口唇我念彌陀甚可傷口稱心散莫能降賴聞佛有慈悲願十念功成達彼方痛哉痛哉真痛哉生死冤家莫挽回我念彌陀已盡力心猿馳逐不歸來幸哉幸哉實幸哉法藏願門正大開極惡愚人能念佛臨終亦送紫金臺約誓自勉自從無始起貪瞋百苦煎熬直至今幸感佛慈垂攝受誓求淨土利羣生佛法已聞又作僧難遭難遇事非輕願求早赴蓮池會廣度眾生報佛恩自恨愚癡染惡深雖求佛法實無成寶山空手真堪惜誓念彌陀出苦輪日課彌陀六萬聲從今誓不更因循但期早促閻浮壽速得西方下品身誡止人情光陰迅速命難存日日須防入死門客至休談塵世語當稱佛號莫停聲無常未測幾時臨當念彌陀待往行慢褻諸公休見怪可憐吾輩障緣深心猿意馬莫能停念佛應須立課程朝定彌陀六萬數深慚失敬上賢賓聽教參禪不奈何無能秖合念彌陀往來上士休垂問憐我如同老太婆七期禁語七日為期勿外求向西稱佛令無休光陰易過誠堪惜尊客臨門恕應酬欲成三昧早生蓮先在當人絕外緣口說是非增散亂故於七日不開言尅期禁語念彌陀痛䇿身心莫放他苦海深沉難自度願憑佛力出娑婆罪報因緣實可傷屢遭兵火受灾殃誓從今世逃生死默默專求大願王日課慎言厭離生死慕華池朝誦彌陀限六時人命無常真可懼縱然對客勿多辭日課彌陀誦未圓客臨休怪默無言死生事大難迴避鈍馬應須著痛鞭自慚口過欲停聲恐負同心念佛人午後稍談生死事是非長短莫開唇同仁垂顧莫閒言當說西方淨土緣慚愧向來無學問癡心只想玉池蓮普勸念佛頌西方有佛號彌陀接引眾生出愛河諸佛同宣當諦信臨終免得見閻羅欲念彌陀出火坑須憑信願力俱深當知一句纔開口極樂蓮華已發生五濁臨時苦日增人根愈陋垢愈深餘門學道難成就淨土橫超易往生炎炎火宅避無門只有西方甚易生惡逆凡夫能十念白牛當處露全身淨土門開道易成賢愚不論悉堪憑但持名號皆成就上善同居莫比倫彌陀願力與光明攝取無邊念佛人但得持名心不亂臨終化佛定來迎西方淨土異常倫為有蓮池九品生末法修行難得度唯依此道出沉淪莫嫌念佛法門低一法能收萬種機上自文殊與徧吉同心發願盡歸依坐禪悟道理圓明那有西方不欲登覺老九旬嘗入定彌陀十萬願求生禪機不悟也無妨只要專心念法王但得臨終生極樂頓開佛慧妙難量深通經義是靈根正好依經求往生一部華嚴該海藏願王回向見慈尊不通經典念彌陀勝過聰明智慧多六字洪名真法界徧收教海沒淆訛榮華富貴事遂心不往西方亦假名一氣不來空手去單單獨獨見閻君貧窮困苦日奔波正好回心念佛陀極樂家鄉原不遠急須歸去莫蹉跎愚人造業必沉淪念佛定然見佛身九品尚收諸惡逆莫愁自己不能生十惡狂徒皆佛子應當念佛早還家天真慈父不求救難免牛頭一鐵扠世事千端仔細詳那能不去見閻王只聞佛有異方便能度眾生出死鄉欲出死生老病鄉須求佛國大慈王彌陀本是天真父及早思歸莫暫忘餘教修行難進路莫如念佛易承當但憑信願為良導穩坐慈航到樂樂慈父望娑婆垂手殷勤十劫多必欲此生超苦海從今速速念彌陀稽首哀陳諸善人慈悲聽察願同行雜修功業心多亂專志持名定往生莫輕吾輩是愚人當信佛言句句真情愛牽連須早捨蓮華清淨急求生苦哉下劣是吾身全賴彌陀大願因再不持名生極樂輪迴萬劫莫超昇善友垂慈再愍聽更偷兩句作人情此身不向今生度更向何生度此身專修要訣專念阿彌陀不必除妄想只要聲不絕決定生安養專念阿彌陀不必參是誰只要心不亂決定出輪迴專念阿彌陀不必懺宿業只要仗佛力決定能消滅專念阿彌陀不必斷煩惱只要佛聲現決定當時少專念阿彌陀不必尋方便只要心常憶決定成一片專念阿彌陀不必求悟門只要到西方決定悟無生專念阿彌陀不必報四恩只要佛不離決定利羣生專念阿彌陀不必多疑惑只要信佛語決定生彼國念佛開心頌崑自學淨宗以來每見念佛之人或執著悟門意不開暢或惡嫌妄想心生憂愁因此二種不能死盡偷心竭力念佛想此二種談何容易從古高賢能有幾人相應得去況當今之世知識愈少業障愈多能開悟門不起妄想又能有幾人而且淨土法門並不如此故徹悟禪師云淨土一門最初省求悟門末後不待發慧不須懺業不斷煩惱至極省要至極徑捷及其證入至極廣大至極究竟余同治癸酉冬在天台教觀七期內忽憶此事心大不喜恐此二種大障令淨土勝異方便不能盛行於時故於解七之日遂從四十八頌欲即流通以結淨緣未知有同志者肯允可否此頌因念佛人心多煩悶而作故名之曰念佛開心凡念佛者肯讀此頌必能開其心懷速成妙功臨終時至決定往生故經云憶佛念佛現前當來必定見佛不假方便自得心開頌分六段念佛得妙一一心念佛妙無窮不用參求理自通念到臨終生極樂等閑大振古家風一心念佛妙無窮金口親傳向上宗諸佛廣長同作證愚夫愚婦悉能通一心念佛妙無窮暫到同居四土融具縛伴中多補處微風聲裏演真宗一心念佛妙無窮頓破無明不假功彼佛三身隨念見塵塵盡現法王宮一心念佛妙無窮徧吉文殊始悟通博地凡夫能信入不離當處見慈容一心念佛妙無窮百草頭邊啟笑容蠢動含靈皆有分聰明禪客却難通一心念佛妙無窮大地羣生一體同廣舌決疑原為此諸賢切莫看輕鬆一心念佛妙無窮憑仗能仁指示功諸祖唯心人已識吾宗唯佛有誰通一心念佛妙無窮趙老瞞人語未終念佛果須真潄口應言何垢在其中一心念佛妙無窮新定因斯得異功念佛一聲出一佛大家親見盡歸宗一心念佛妙無窮寶誌輕西為己宗誰識愚人能樂彼靈光已託寶華中一心念佛妙無窮智者深知不面東最後舉揚無別事殷勤獨讚藕華宮散持有功二法華經云若人散亂心入於塔廟中一稱南無佛皆已成佛道西齋詩云魄飛心散亂佛號罪銷鎔蓮爍如初日西昇極樂宮秘藏指南云深信切願念佛而念佛時心多散亂者即是下品下生華開雖遲樂勝天宮永脫輪𢌞位居不退敬遵此旨而述頌言散亂持名大有功經文明載法華中散稱一句皆成佛多誦應知道德充散亂持名大有功橫超帶業最圓融彌陀願海如斯異諸佛咨嗟讚不窮散亂持名大有功往生不落疑城中暫時九品分高下究竟莊嚴與佛同散亂持名大有功無邊教海盡融通但憑記數常專念不必先求妄想空散亂持名大有功多生愛索一時鬆休將妄想嫌如賊當識佛聲妙莫窮散亂持名大有功幽途蒙照悉皆通莫令佛日西山落那怕迷雲百萬重散亂持名大有功平除妄想若雷轟假饒還有干邪在不敢私心起害風散亂持名大有功如當亂世出英雄不愁盜賊千千萬只要將軍智力充散亂持名大有功彌陀攝受德無窮任憑雜念常侵擾佛號厲稱莫放鬆散亂持名大有功垢心未斷入蓮宮彌陀常運於身口定保臨終不落空散亂持名大有功縱然造業不能𠒋一朝感佛垂加護萬億程途彈指通散亂持名大有功何愁地獄莫能空善知臨死生惶怖十念亦超極樂宮不求開悟三蓮宗不必求開悟唯在當人知淨土彈指便能見法王何須別走他鄉路蓮宗不必求開悟倘已悟明須急吐但把彌陀老實持自然𫎇佛親吩咐蓮宗不必求開悟須走故鄉徑直路口上彌陀放寶光照開家裏金銀庫蓮宗不必求開悟當信彌陀是舊父日日思親不暫忘臨終決定分明覩蓮宗不必求開悟須掐輪珠百八數只要手中勿暫停珠珠照徹心王路蓮宗不必求開悟六字洪名須保護但得口中刻刻持聲聲喚應天真父蓮宗不必求開悟却要時時朝佛坐暫向彌陀本性明何勞別想心光露蓮宗不必求開悟應定彌陀多少數日日能持十萬聲時時常走歸元路不問如何四妄想不必問如何但管持名莫厭他六八願王垂攝受無勞斷惑出娑婆妄想不必問如何只要看伊是甚麼但保佛聲無間斷千思萬想總憑他妄想不必問如何直把洪名著力呼譬若路行逢盜賊須憑喊救始堪過妄想不必問如何當識自身是大魔日夜思量皆為此誓持佛號勿隨他妄想不必問如何須立功勳抵死魔每日持名歸幾萬無明煩惱任他多妄想不必問如何全在彌陀念得多雜亂垢心能記佛當知罪業已消磨妄想不必問如何總是前生業障多久病暫時纔服藥安能便得離沉疴妄想不必問如何當起悲心念佛陀莫恨持名多散亂須憑信願脫娑婆稱讚佛號五當知佛號福無窮暫舉一聲眾罪空非少善根原在此故令持者往蓮宮當知佛號德彌深竭力十稱即往生惡逆之人能遇此定教不落泥犁坑當知佛號功無比作佛因緣從此起昔有樵夫念一聲如今久在華池裏當知佛號妙難量一句隨稱萬德彰諸佛因斯皆護念眾生不信實堪傷呵棄妄想六當知妄想最堪呵常害行人落愛河今日持名不懇切只愁仍舊在娑婆當知妄想禍根深刻刻令人失正因單舉洪名終不伏須加信願始堪平當知妄想本真心逐境昏迷作禍根信願持名休放逸聲聲能攝妄歸真當知妄想有奇勳彈指能摧地獄城以此求生尤易往隨他造業永沉淪頌成回向我今作此頌為斷諸人惑兼備自修行以此作警䇿每見念佛人心中多不決或想除妄心或思參明白因此二種心生起種種惑或生別求心或嫌不得力或愁心不明或憂多罪業是故念佛時心中不能切不知念佛門橫超帶惑業不須參話頭自然心明白我發至誠心奉對諸人說盡採大乘經皆遵祖師說倘有虗妄言自當墮拔舌若能合於經願佛早垂接為此然臂香炷數四十八以表真實心聊酬佛恩德唯願諸眾生讀此生歡悅漸漸心華開漸漸妄想滅隨力念佛名心中無疑惑念到命終時決定生彼國倘有讀誦人知此有利益願發大慈悲處處代傳說我今作頌完回向此功德願同諸眾生早生安樂國極樂甚奇特或有難云法門無量誓願學何故偏戀西方不修餘行答曰吾欣此門易修易至功高奇特復說偈云吾欣極樂甚奇特不怕眾生具惡逆但肯回心念佛名頓消地獄生蓮國吾欣極樂甚奇特生者還能帶惑業有此法門不肯修輪迴何日得超越吾欣極樂甚奇特攝受凡愚生彼國如此功能何處來皆從法藏願心出吾欣極樂甚奇特六字包含無量德只要持名信願堅臨終佛必親垂接淨宗八要同治癸酉春月佛涅槃日余在虞東明因寺捧讀曉柔法師淨土詩八首曰欣曰厭曰信曰願曰行曰專曰久曰警誠哉此詩可謂淨土之要關行人之痛䇿修淨業者不可不讀余因此有感於懷不覺頓忘鄙陋拈筆和之愧無文理不敢續附於後故別錄之名淨宗八要以為自警云爾古崑敬然臂香九炷謹識欣西方勝境獨超倫上善同居絕苦辛風動樹林宣妙響鳥飛空處現奇身寶蓮華裏人如佛功德池中水是珍欲慕臨終生彼國須從平素不因循厭吾躬下劣孰同倫昏昧愚癡最苦辛口裏喜談塵世語心中偏著女人身聲名本假貪如寶財利原空愛若珍多劫沉迷方起厭急須念佛莫因循信蓮清淨絕塵囂立志求生勿動搖佛有慈悲容彼入土無高下任吾超心言相合終歸去感應道交不用招篤信修行全智力功能成就罪能消願立心堅固勿循情誡止閑非不妄行淨業功多應努力塵緣過重必須輕欲令彼國蓮華大全在當人道念成發願往生親見佛速來救苦出迷城行讀誦洪名不用疑堂堂大路向西馳光陰有限宜精進人命無常莫待時欲識念心是那箇須知彼佛號阿彌但憑此行歸安養定作娑婆說法師專修行定課事何饒日日如斯始可標雜學餘門原路遠專持佛號豈途迢輪珠記數平常念蓮蕚書名必獲超但辦一心生極樂莊嚴功德永無消久極樂迢迢甚易超全憑誦佛志無搖聲聲相繼莊嚴露念念勿忘功德饒終日修行靡間斷畢生求願豈堪聊蓮從此朝朝近懈怠情萌路轉遙警久迷本性最堪嗟道業難成苦永遐宿世造愆真可惜今生修善不宜差攀緣必落輪迴所謗法終歸地獄家警䇿身心勤念佛定超彼國淨無瑕痛䇿惡習貪毒深道難學常求名利必無覺急須看破念彌陀始可臨終生極樂嗔火大行難成雖念彌陀被惡侵須向逆緣常忍耐西方淨土始超生癡垢重罪難明不知因果枉修行非憑善友常提那可今生出苦輪慢山高法難住明師雖遇亦徒費必須自己生深慚方得持名登寶地稱名自慰我稱佛不相同全賴妄心顯大功平世安知兵有力賊臨始見將威風空妄想亂如𮈔不念彌陀那得知心鏡初磨謂影現當知佛號妙難思稱佛名用珠算轉凡成聖功難判欲求極樂速超生只要朝朝數不亂口稱佛心必清如人重魘聞呼聲因茲不怕心多亂只怕口中斷佛音蓮宗初祖念佛三昧序云夫玄音之扣塵累每銷滯情融朗非天下之至妙其孰能與於此古崑所以每勸持名者切莫怕妄想嫌罪垢而先求一心不亂只要出音記數畢命為期佛一出音珠一記數塵累每銷滯情融朗功愈勝矣經云於念念中除八十億劫生死之罪即塵累每銷又云散心稱一聲皆已成佛道即滯情融朗豈有不令妄想時時而輕罪垢時時而減一聲佛一聲相應聲聲佛聲聲相應亦此之謂歟當知出音記數畢命為期縱未到一心不亂信願必然堅固往生決定可期不過品位暫低而已故要解云得生與否全由信願之有無品位高下全由持名之深淺奉告有緣之士於持名時只要令音聲不絕不必著一心不亂音聲不絕是因一心不亂是果因行若真果必成就自然而然所謂形直則影端聲和則響順可惜今時人佛尚不肯常稱於句句中有銷塵融滯之功德亦不知便先想一心不亂豈非鳥無翼而欲飛樹無根而欲茂所以每每念彌陀每每沒滋味念得妄想多便向別門去嗚呼哀哉淨土法門衰敗至此可謂極矣願我同流出音記數努力努力又當知出音是口記數是身故妙叶禪師云能運身口之念母論其散但不間斷自能一心亦可即名一心惟行之不休為度固不必憂散亂矣如母喪愛子龍失命珠不期心一而自一豈制之令一也心不可制實在行人勤怠耳
